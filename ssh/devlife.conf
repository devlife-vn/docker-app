server {
    server_name devlife.vn www.devlife.vn m.devlife.vn;

    root /var/www/devlife/public;
    index index.php index.html;

    access_log /var/log/nginx/devlife.access.log;
    error_log /var/log/nginx/devlife.error.log error;

    # Laravel route - cho phép bfcache hoạt động
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # PHP xử lý - cũng cho phép bfcache
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Chặn file ẩn như .htaccess
    location ~ /\.ht {
        deny all;
    }

    # Tài nguyên favicon/robots không cần log
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Static files - cache mạnh để tăng PageSpeed
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        log_not_found off;
    }

    # SSL với HTTP/2
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/devlife.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devlife.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    # Redirect HTTP sang HTTPS
    listen 80;
    listen [::]:80;
    server_name devlife.vn www.devlife.vn;

    if ($host = www.devlife.vn) {
        return 301 https://$host$request_uri;
    }

    if ($host = devlife.vn) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
