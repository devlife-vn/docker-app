server {
    listen 80;
    server_name sgtimes.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443;
    ssl_certificate /etc/nginx/ssl/sgtimes.local.crt;
    ssl_certificate_key /etc/nginx/ssl/sgtimes.local.key;

    server_name sgtimes.local;
    root /var/www/sgtimes/public;
    index index.php index.html index.htm;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }
    
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/sgtimes-error.log;
    access_log /var/log/nginx/sgtimes-access.log;
}
